# ============================================================================
# VoiceLink WebSocket Apache configuration snippet
#
# Place inside your existing <VirtualHost> block OR in a separate file in
# /etc/apache2/conf-available/ and then enable it:
#   sudo a2enconf voicelink-ws
#   sudo systemctl reload apache2
#
# Required Apache modules:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
#   sudo systemctl restart apache2
# ============================================================================

# ── WebSocket proxy ──────────────────────────────────────────────────────────
#
# All requests to /ws (or /web-rtc/ws for subfolder installs) are transparently
# proxied to the Ratchet WS server running on localhost:8080.
#
# Adjust the ProxyPass path to match your DOMAIN setting in .env:
#   DOMAIN=localhost         → ProxyPass /ws
#   DOMAIN=localhost/web-rtc → ProxyPass /web-rtc/ws
#
# Update WS_PUBLIC_URL in .env to match:
#   WS_PUBLIC_URL=ws://localhost/ws           (or wss:// for SSL)
#   WS_PUBLIC_URL=ws://localhost/web-rtc/ws
# ────────────────────────────────────────────────────────────────────────────

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Upgrade HTTP → WebSocket for /web-rtc/ws (adjust path to match your setup)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/web-rtc/ws(/.*)?$ ws://127.0.0.1:8080/$1 [P,L]
</IfModule>

<IfModule mod_proxy.c>
    <IfModule mod_proxy_wstunnel.c>
        # WebSocket path
        ProxyPass        /web-rtc/ws  ws://127.0.0.1:8080/
        ProxyPassReverse /web-rtc/ws  ws://127.0.0.1:8080/
    </IfModule>
</IfModule>

# Security: never expose the admin port to the public
# The admin server only listens on 127.0.0.1:{WS_ADMIN_PORT} so no extra
# Apache rule is needed — it is unreachable from outside the server.
